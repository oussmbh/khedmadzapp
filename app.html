<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>تحميل تطبيق KhedmaDZ من Google Play</title>

  <meta
    name="description"
    content="حمّل تطبيق KhedmaDZ للبحث عن فرص العمل ونشر عروض التوظيف في الجزائر."
  >

  <meta
    http-equiv="refresh"
    content="3;url=https://play.google.com/store/apps/details?id=com.khedmadz.app"
  >

  <link
    rel="canonical"
    href="https://play.google.com/store/apps/details?id=com.khedmadz.app"
  >

  <style>
    :root {
      --primary: #f3b51b;
      --dark: #172033;
      --muted: #64748b;
      --background: #f8fafc;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--dark);
      font-family: Arial, "Cairo", sans-serif;
      text-align: center;
    }

    .download-card {
      width: min(100%, 520px);
      padding: 42px 28px;
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .download-logo {
      width: 86px;
      height: 86px;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
    }

    p {
      margin: 0 auto 24px;
      color: var(--muted);
      line-height: 1.8;
    }

    .download-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 24px;
      border-radius: 12px;
      background: var(--primary);
      color: #111827;
      text-decoration: none;
      font-weight: 700;
      transition: 0.25s ease;
    }

    .download-button:hover {
      transform: translateY(-2px);
      filter: brightness(0.96);
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main class="download-card">
    <img
      class="download-logo"
      src="design.dz.png"
      alt="شعار تطبيق KhedmaDZ"
    >

    <h1>تحميل تطبيق KhedmaDZ</h1>

    <p>
      سيتم تحويلك إلى Google Play لتحميل التطبيق.
      إذا لم يتم التحويل تلقائياً، اضغط على الزر أدناه.
    </p>

    <a
      class="download-button"
      href="https://play.google.com/store/apps/details?id=com.khedmadz.app"
    >
      الانتقال إلى Google Play
    </a>

    <div class="note">
      التطبيق متوفر حالياً لأجهزة Android فقط
    </div>
  </main>
</body>
</html>
